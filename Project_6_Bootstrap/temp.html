<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D buttons</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .btn-3d {
      background: #e0e0e0;
      color: #000;
      border: 1px solid #a0a0a0;
      padding: .35rem .75rem;
      font-size: .95rem;
      border-radius: 4px;
      /* выпуклая кнопка */
      box-shadow: inset -1px -1px 0 #fff, inset 1px 1px 0 #888;
    }

    /* стрелка вниз */
    .btn-3d.dropdown-toggle::after {
      border-top-color: #111 !important;
      margin-left: .35rem;
    }

    /* состояние при нажатии (вдавленная) */
    .btn-3d:active, .btn-3d.show {
      background: #d0d0d0;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #888;
    }

    /* меню */
    .dropdown-menu {
      border: 1px solid #aaa;
      border-radius: 4px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }
    .dropdown-item:hover {
      background: #f0f0f0;
    }

    .btns-wrap { display:flex; }
  </style>
</head>
<body>

  <header>
    <div class="container py-3">
      <div class="btns-wrap">
        <!-- Первый dropdown -->
        <div class="btn-group">
          <button id="btnLinks" type="button"
            class="btn btn-3d dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Ciekawe linki
          </button>
          <ul class="dropdown-menu" aria-labelledby="btnLinks">
            <li><a class="dropdown-item" href="http://ur.edu.pl">URz</a></li>
            <li><a class="dropdown-item" href="http://onet.pl">Onet</a></li>
            <li><a class="dropdown-item" href="http://tutorialspoint.com">Tutorials Point</a></li>
          </ul>
        </div>

        <!-- Второй dropdown -->
        <div class="btn-group">
          <button id="btnPortale" type="button"
            class="btn btn-3d dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Portale społecznościowe
          </button>
          <ul class="dropdown-menu" aria-labelledby="btnPortale">
            <li><a class="dropdown-item" href="#">Facebook</a></li>
            <li><a class="dropdown-item" href="#">Twitter</a></li>
            <li><a class="dropdown-item" href="#">Instagram</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
